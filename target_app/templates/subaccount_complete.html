<!DOCTYPE html>
<html>
<head>
  <title>Sub-Account Opened</title>
  <style>{% include "_legacy.css" %}</style>
</head>
<body>
<div class="pad">

<table class="l" width="100%"><tr><td class="hdr" style="background:{{ t.accent }};">
  Sub-Account Opened
</td></tr></table>

<div class="ok">Request completed. The sub-account is now open.</div>

<table class="l box" cellpadding="0" cellspacing="0">
  <tr><td class="k">New Account Number</td><td>{{ account.number }}</td></tr>
  <tr><td class="k">Type</td><td>{{ account.kind }}</td></tr>
  <tr><td class="k">Opening Balance</td><td>{{ account.balance|money }}</td></tr>
  <tr><td class="k">Member</td><td>{{ member.name }} ({{ member.number }})</td></tr>
</table>

<br>
<a href="{{ t.path('/members/' ~ member.number) }}">Return to {{ t.label('member_record') }}</a>

</div>
</body>
</html>
