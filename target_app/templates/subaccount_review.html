<!DOCTYPE html>
<html>
<head>
  <title>Review Sub-Account Request</title>
  <style>{% include "_legacy.css" %}</style>
</head>
<body>
<div class="pad">

<table class="l" width="100%"><tr><td class="hdr" style="background:{{ t.accent }};">
  Review Sub-Account Request
</td></tr></table>

<br>
<table class="l box" cellpadding="0" cellspacing="0">
  <tr><td class="k">Member</td><td>{{ member.name }} ({{ member.number }})</td></tr>
  <tr><td class="k">{{ t.label('account_type') }}</td><td>{{ kind }}</td></tr>
  <tr><td class="k">{{ t.label('initial_deposit') }}</td><td>{{ amount|money }}</td></tr>
</table>

<br>
<div class="msg">
  Submitting this request opens the account immediately. It cannot be reversed
  from this console.
</div>

<form method="post" action="{{ t.path('/members/' ~ member.number ~ '/subaccount/confirm') }}">
  <input type="hidden" name="acct_type" value="{{ kind }}">
  <input type="hidden" name="deposit_amt" value="{{ amount }}">
  <input type="submit" value="{{ t.label('submit_order') }}">
</form>

</div>
</body>
</html>
